<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sola</title>
    <link rel="stylesheet" href="./still.css" />
  </head>
  <body>
    <div class="system">
      <div class="sun"></div>
      <div class="orbit mercury">
        <div
          class="planet"
          style="--size: 15px; --bg-image: url(&quot;./mercury.png&quot;)"
        ></div>
      </div>
      <div class="orbit venus"><div class="planet" style="--size: 20px; --bg-image: url('venus.png')`"></div></div>
      <div class="orbit earth"><div class="planet" style="--size: 23px; --bg-image: url('earth.png')"></div></div>
      <div class="orbit mars"><div class="planet" style="--size: 17px; --bg-image: url('mars.png')"></div></div>
      <div class="orbit jupiter"><div class="planet-1" style="--size: 45px; --bg-image: url('jupiter.png')"></div></div>
      <div class="orbit saturn"><div class="planet-1" style="--size: 40px; --bg-image: url('saturn.png')"></div></div>
      <div class="orbit uranus"><div class="planet-1" style="--size: 35px; --bg-image: url('uranus.png')"></div></div>
      <div class="orbit neptune"><div class="planet-1" style="--size: 33px; --bg-image: url('neptune.png')"></div></div>
    </div>
  </body>
</html>
